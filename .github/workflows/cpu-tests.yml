name: CPU tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"
      - name: Validate bootstrap inventory
        run: python scripts/validate_bootstrap.py
      - name: Run reusable standard-library and PyTorch tests
        run: python -m unittest discover -s tests/reusable -p "test_*.py"
      - name: Run package and runtime budget tests
        run: python -m pytest -q tests/test_package.py tests/test_runtime_budget.py tests/test_core_proposals.py tests/test_calculator_contract.py
