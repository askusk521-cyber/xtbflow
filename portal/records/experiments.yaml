    - {arm: A1, desc: 串联，事件级引导, recall: [0.020, 0.110, 0.233, 0.397, 0.544], auc: 0.2555}
    - {arm: A2, desc: 强自适应串联（主对照）, recall: [0.000, 0.005, 0.198, 0.237, 0.498], auc: 0.1721}
    - {arm: B0, desc: 联合，无引导, recall: [0.222, 0.356, 0.498, 0.641, 0.744], auc: 0.4945}
    - {arm: B1, desc: 联合，几何引导（主方法）, recall: [0.079, 0.138, 0.238, 0.374, 0.542], auc: 0.2652}
