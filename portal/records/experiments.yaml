# 森林图：只收录有双侧 95% 区间的配对差值。各行指标不同，读法见 favors。
forest:
  - {exp: m0, label: "M0：Hit@32，联合 − 串联", est: -0.0150, lo: -0.0670, hi: 0.0326, favors: 正值 = 联合更好}
  - {exp: v1a, label: "V1a：AUC，B1 − A2（主比较）", est: 0.0931, lo: 0.0682, hi: 0.1180, favors: 正值 = 引导联合更好}
  - {exp: v1a, label: "V1a：机制 M₀", est: 0.0212, lo: 0.0171, hi: 0.0253, favors: 正值 = 评分方向有效}
  - {exp: v1a, label: "V1a：AUC，B1 − B0", est: -0.2293, lo: -0.2447, hi: -0.2138, favors: 正值 = 引导优于不引导}
  - {exp: v1a-n, label: "V1a-N：AUC，B0 − 步数对齐串联", est: -0.016, lo: -0.045, hi: 0.013, favors: 正值 = 联合省步数之外仍有优势}
  - {exp: smc, label: "SMC：生成中筛选 − 事后排序", est: -0.016, lo: -0.032, hi: 0.000, favors: 正值 = 生成中筛选更好}
  - {exp: enum, label: "b3f3 枚举 − 生成 B0", est: -0.177, lo: -0.230, hi: -0.123, favors: 正值 = 枚举更好}
  - {exp: t1b, label: "b2f2 枚举 + 热力学 − 生成 B0", est: -0.0554, lo: -0.1070, hi: -0.0039, favors: 正值 = 枚举更好}
  - {exp: oracle, label: "AIMNet2 − GFN2：Spearman ρ（生成几何）", est: 0.111, lo: 0.056, hi: 0.166, favors: 正值 = AIMNet2 排序更准}

# V1a 五臂成本曲线（RESULT_ZH.md 表格，母体 × 三个训练 seed 平均）
v1a_curves:
  budgets: [4, 8, 16, 32, 64]
  arms:
