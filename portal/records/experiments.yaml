# status 取值：go / nogo / paused / explore / running
# level 取值：gate（预注册闸门，确认性）/ exploratory（探索性）
experiments:
  - id: m0
    name: M0 联合 vs 串联闸门
    short: M0
    date: 2026-10-07
    level: gate
    status: nogo
    verdict: NO-GO
    question: 无引导、参数与步数相同时，联合生成“事件与 TS 几何同时命中”的比例是否高于串联？
    finding: 主终点 Δ(B−A) = −0.0150 [−0.0670, 0.0326]，区间包含 0；合法率 −0.0267 [−0.0398, −0.0126]。35 个测试母体。“没有更好”，不是“更差”。
    prs: [101, 103, 102, 104, 105]
    evidence:
      - {pr: 105, path: docs/m0/M0_GATE_REPORT.md, label: 闸门报告}
      - {pr: 105, path: docs/evidence/m0/gate_result.json, label: gate_result.json}
    raw: [m0/stabilize-20261007/replay, m0/stabilize-20261007/tune, m0/stabilize-20261007/full, m0/stabilize-20261007/test]
    paper: paper/results.md#m0

  - id: v1a
    name: V1a 已知通道代理筛查
    short: V1a
    date: 2026-10-07
    level: gate
    status: go
    verdict: GO_V1b
    question: 生成中按几何势垒分数施加引导，能否经由耦合改变事件，并在有限 T1x 目录上提高低势垒已知通道的发现效率？
    finding: 主比较 AUC(B1) − AUC(A2) = +0.0931 [+0.0682, +0.1180]；机制 M₀ +0.0212、Mᵣ +0.0211，下界均 > 0。边界：无引导 B0 的 AUC 0.494 高于 B1 的 0.265。
    prs: [106]
    evidence:
      - {pr: 106, path: docs/evidence/v1a/formal/RESULT_ZH.md, label: 正式结果}
      - {pr: 106, path: docs/evidence/v1a/formal/, label: formal/ 目录（gate.json、freeze.json、SHA256SUMS）}
      - {pr: 106, path: docs/v1a/FREEZE_DECISION_ZH.md, label: 冻结前规划决定}
      - {pr: 106, path: docs/v1a/protocol-v2.1.md, label: V1a 指导 v2.1}
    raw: [v1a-20261007]
    paper: paper/results.md#v1a

  - id: v1a-r
    name: V1a-R 零算力重分析
    short: V1a-R
    date: 2026-10-08
    level: exploratory
    status: explore
    verdict: 探索性
    question: 按候选数对齐、并计入验证成本 κ 后，各臂的相对位置如何？
    finding: 同候选数下 A1>A0、B1≈B0、B0≈A0；前沿依次为 B0（κ≤300）→ A1 → A2（κ≥3000）；B1 在任何 κ 下都不在前沿。
    prs: [107]
    evidence:
      - {pr: 107, path: docs/evidence/v1a_r/REPORT_ZH.md, label: 报告}
    raw: [v1a-r-20261008]
    paper: paper/results.md#v1a-r

  - id: v1a-n
    name: V1a-N 步数对齐对照
    short: V1a-N
    date: 2026-10-08
    level: exploratory
    status: explore
    verdict: 探索性
    question: B0 的单位预算优势，是否只是因为它每个候选用的积分步数更少？
    finding: AUC(B0-50) − AUC(A0-25+25) = −0.016 [−0.045, +0.013]：B0 的预算优势可由积分步数解释。
    prs: [109]
    evidence:
      - {pr: 109, path: docs/evidence/v1a_n/REPORT_ZH.md, label: 报告}
    raw: [v1a-n-20261008]
    paper: paper/results.md#v1a-n

  - id: v1b-amend
    name: V1b 修订草案 v2.2
    short: V1b v2.2
    date: 2026-10-08
    level: gate
    status: paused
    verdict: 草案未冻结
    question: 把 V1b 认证从两臂扩为四臂，主决策规则不变。
    finding: 四臂认证草案，未冻结；按暂定单价估 305/564 GPU·h。
    prs: [108]
    evidence:
      - {pr: 108, path: docs/v1b/AMENDMENT_v2.2_ZH.md, label: 修订草案}
    raw: []
    paper: paper/results.md#v1b

  - id: v1b
    name: V1b D0 + D1（DFT 认证准备）
    short: V1b
    date: 2026-10-08
    level: gate
    status: paused
    verdict: 负责人暂缓
    question: 冻结抽样总体（D0），并用 6–10 条开发链实测完整 DFT 认证链（D1）。
    finding: D0：M=342，Δ^proxy = +0.0673。D1：8/8 候选精修为一阶鞍点；协议升到 v1b-h-gpu4pyscf-3；003317dd 的端点软模仍是 PROTOCOL_FAILURE。约 6.1 + 0.6 GPU·h。10-08 负责人暂缓。
    prs: [122]
    evidence:
      - {pr: 122, path: docs/v1b/D1_REPORT_ZH.md, label: D1 报告}
    raw: [v1b-20261007]
    paper: paper/results.md#v1b

  - id: geoinfo
    name: 几何信息检查
    short: 几何信息
    date: 2026-10-08
    level: exploratory
    status: explore
    verdict: INCONCLUSIVE / NO_USABLE_WINDOW
    question: 真实 TS 几何能否改善事件排序？物理信号在生成过程中何时才可用？
    finding: 真实 TS 几何没有可检出的排序增益；当前时钟下 xTB 可用窗口只有 14.5%。
    prs: [110]
    evidence:
      - {pr: 110, path: docs/evidence/explore_geoinfo/REPORT_ZH.md, label: 报告}
    raw: [explore-geoinfo-20261008]
    paper: paper/results.md#geometry

  - id: geolead
    name: 几何先行时钟
    short: 几何先行
    date: 2026-10-08
    level: exploratory
    status: explore
    verdict: GEOMETRY_LEAD_OPENS_WINDOW
    question: 推迟事件定型、让几何先成形，能否打开物理信号的作用窗口？
    finding: 窗口升到 27.9% / 34.6%，合法率约 −1.5 个百分点，生成质量几乎不变。
    prs: [111]
    evidence:
      - {pr: 111, path: docs/evidence/explore_geolead/REPORT_ZH.md, label: 报告}
    raw: [explore-geoinfo-20261008]
    paper: paper/results.md#geometry

  - id: physics
    name: 鞍点感知物理引导
    short: 物理引导
    date: 2026-10-08
    level: exploratory
    status: explore
    verdict: SHIFT_NOT_SPECIFIC / NO_DETECTABLE_SHIFT
    question: 生成中施加鞍点感知的物理引导，能否让事件定向地偏向低势垒通道？
    finding: α=0.3 时事件会变但没有方向性，α=1.0 时检不出偏移；窗口在 35–38% 见顶。
    prs: [112]
    evidence:
      - {pr: 112, path: docs/explore/PHYSICS_GUIDANCE_DESIGN_ZH.md, label: 设计与结果}
    raw: [explore-geoinfo-20261008]
    paper: paper/results.md#geometry

  - id: smc
    name: 生成中 SMC 筛选
    short: SMC
    date: 2026-10-09
    level: exploratory
    status: explore
    verdict: NO_GAIN_OVER_POSTHOC
    question: 生成过程中按物理权重重采样粒子，是否胜过生成完再排序？
    finding: relaxed_0.7 − none = −0.016 [−0.032, +0.000]；原始能量排序消融（#117）与严格顺序复验（#118）结论不变。
    prs: [116, 117, 118]
    evidence:
      - {pr: 116, path: docs/evidence/explore_smc/REPORT_ZH.md, label: 报告}
      - {pr: 117, path: docs/evidence/explore_smc/, label: 原始能量排序消融}
      - {pr: 118, path: docs/evidence/explore_smc/, label: 严格顺序复验}
    raw: [explore-smc-20261009]
    paper: paper/results.md#selection

  - id: enum
    name: 枚举基线（b3f3）
    short: 枚举 b3f3
    date: 2026-10-09
    level: exploratory
    status: explore
    verdict: GENERATION_BEATS_ENUMERATION
    question: 穷举 b3f3 事件再用实反应势垒头排序，能否追上生成？
    finding: AUC(S_N) − AUC(B0) = −0.177 [−0.230, −0.123]，生成胜过枚举。
    prs: [113]
    evidence:
      - {pr: 113, path: docs/evidence/review_enum/, label: 证据目录}
    raw: [review-align-20261009]
    paper: paper/results.md#baselines

  - id: oracle
    name: 物理预言机排序对比
    short: 预言机
    date: 2026-10-09
    level: exploratory
    status: explore
    verdict: 探索性
    question: 不同物理预言机（GFN2-xTB、AIMNet2）给候选排序的能力差多少？
    finding: GFN2 ρ 精确复现 0.7491；AIMNet2 的 ρ 提升：参考几何 +0.175 [0.071, 0.278]，生成几何 +0.111 [0.056, 0.166]。
    prs: [114]
    evidence:
      - {pr: 114, path: docs/evidence/review_oracle/REPORT_ZH.md, label: 报告}
    raw: [review-align-20261009]
    paper: paper/results.md#baselines

  - id: o1
    name: 开放世界 xTB 认证（O1）
    short: O1
    date: 2026-10-09
    level: exploratory
    status: explore
    verdict: 阳性对照通过
    question: 目录之外生成的候选，能否通过 CPU xTB 认证？
    finding: 阳性对照 17/20（闸门通过）；目录外 17/40 通过 xTB 认证；ΔEa < 0 只有 1/12。
    prs: [115]
    evidence:
      - {pr: 115, path: docs/evidence/review_open_world/, label: 证据目录}
    raw: [review-align-20261009]
    paper: paper/results.md#open-world

  - id: t1b
    name: 枚举 + 热力学筛选（T1b）
    short: T1b
    date: 2026-10-10
    level: exploratory
    status: explore
    verdict: GENERATION_BEATS_ENUMERATION
    question: 给 b2f2 穷举加上 AIMNet2 产物热力学筛选后，能否追上生成？
    finding: AUC(S_N_thermo) − AUC(B0) = −0.0554 [−0.1070, −0.0039]；热力学筛选相对不筛 +0.051。只看最佳通道属于 b2f2 的母体时，枚举胜过生成：+0.103 [0.042, 0.164]。
    prs: [120]
    evidence:
      - {pr: 120, path: docs/evidence/explore_enum_thermo/REPORT_ZH.md, label: 报告}
      - {pr: 120, path: docs/evidence/explore_enum_thermo/, label: 证据目录}
    raw: [followup-20261009]
    paper: paper/results.md#baselines

  - id: t2
    name: 反应坐标诊断 + 预言机 SMC（T2a/T2b）
    short: T2
    date: 2026-10-10
    level: exploratory
    status: explore
    verdict: LINE_CLOSURE_RECOMMENDED
    question: 生成器的速度方向是否就是反应模？换成物理预言机做 SMC 权重能否带来增益？
    finding: T2a U_NOT_REACTION_MODE（真实 TS 上 c_u<0 只占 19%）；T2b 8 臂全部 NO_GAIN_OVER_POSTHOC，预写建议关闭该研究线（仅为建议）。
    prs: [121]
    evidence:
      - {pr: 121, path: docs/evidence/explore_u_diagnostic/, label: T2a 证据}
      - {pr: 121, path: docs/evidence/explore_smc_oracle/, label: T2b 证据}
    raw: [followup-20261009]
    paper: paper/results.md#selection

  - id: o2
    name: 开放世界 DFT 认证（O2）
    short: O2
    date: 2026-10-10
    level: exploratory
    status: running
    verdict: 运行中
    question: 用冻结的 DFT 协议认证 O1 选出的开放世界通道；核查 AIMNet2 训练集是否覆盖这些分子。
    finding: 3b：两个模型都是 UNRESOLVED。3a：锚点通过 1 项、参考链失败 1 项（SCF_LIMIT），基础设施失败 3 项；剩余 28 项于 10-17 恢复运行。
    prs: [119]
    evidence:
      - {pr: 119, path: docs/evidence/review_open_world_o2/DECISION_ZH.md, label: 决定记录}
      - {pr: 119, path: docs/evidence/review_open_world_o2/INFRASTRUCTURE_ZH.md, label: 基础设施记录}
      - {pr: 119, path: docs/evidence/review_open_world_o2/DECISION_NVML_ZH.md, label: NVML 绕行决定}
    raw: [followup-20261009]
    paper: paper/results.md#open-world

