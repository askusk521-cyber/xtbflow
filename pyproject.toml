[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xtbflow"
version = "0.1.0"
description = "Contract-first conserved event and geometry flow research adapters"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xtbflow contributors" }]
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.10,<2.11",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[tool.setuptools]
include-package-data = true
packages = [
  "xtbflow",
  "xtbflow.runtime",
  "xtbflow.data",
  "xtbflow.proposals",
  "xtbflow.calculators",
  "xtbflow.models",
  "xtbflow.training",
  "mechai",
  "mechai.data",
  "mechai.evaluation",
  "mechai.models",
]

[tool.setuptools.package-dir]
xtbflow = "src/xtbflow"
mechai = "vendor/mechai_reusable/mechai"
"mechai.data" = "vendor/mechai_reusable/mechai/data"
"mechai.evaluation" = "vendor/mechai_reusable/mechai/evaluation"
"mechai.models" = "vendor/mechai_reusable/mechai/models"
